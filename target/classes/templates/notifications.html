<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Notifications')}"></head>
<body>
<nav th:replace="~{fragments :: sidebar('notifications')}"></nav>
<main class="content">
  <h3 class="mb-3">Notifications</h3>
  <div class="alert alert-success" th:if="${#lists.isEmpty(notifs)}"><i class="bi bi-check-circle"></i> Nothing needs your attention right now.</div>
  <div class="list-group">
    <a th:each="n : ${notifs}" th:href="@{/assets/{id}(id=${n.assetId()})}" class="list-group-item list-group-item-action d-flex gap-3 align-items-center"
       th:classappend="${n.severity() == 'danger'} ? 'list-group-item-danger' : 'list-group-item-warning'">
      <span class="badge bg-dark" th:text="${n.type()}"></span><span th:text="${n.message()}"></span></a>
  </div>
  <p class="text-muted small mt-3">Rules: warranty/insurance expiring within 30 days, maintenance due within 7 days or overdue, pending repairs, and assets with a low health score.</p>
</main>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body></html>
