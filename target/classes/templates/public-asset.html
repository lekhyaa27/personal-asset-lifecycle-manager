<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Asset Details')}"></head>
<body>
<div class="container py-4" style="max-width:640px">
  <div class="card"><div class="card-body">
    <div class="text-muted small"><i class="bi bi-box-seam"></i> Personal Asset Lifecycle Manager</div>
    <h3 class="mt-1 mb-2" th:text="${name}">Asset</h3>
    <span th:replace="~{fragments :: badge(${status})}"></span>
    <table class="table table-sm mt-3 mb-3">
      <tr th:each="f : ${facts}"><th class="text-muted fw-normal" style="width:42%" th:text="${f.key}"></th><td th:text="${f.value}"></td></tr>
    </table>
    <a class="btn btn-primary w-100" th:href="@{/a/{t}/pdf(t=${token})}"><i class="bi bi-file-earmark-pdf"></i> Download details (PDF)</a>
    <div class="small text-muted mt-3">Read-only summary. Owner details, notes, expenses and documents are not shown.</div>
  </div></div>
</div>
</body></html>
