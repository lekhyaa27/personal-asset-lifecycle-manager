<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Error')}"></head>
<body>
<div class="auth-wrap"><div class="card auth-card"><div class="card-body p-4 text-center">
  <h1 class="display-6 text-danger"><i class="bi bi-exclamation-triangle"></i></h1>
  <h5>Something went wrong</h5>
  <p class="text-muted" th:text="${message != null and message != ''} ? ${message} : 'The page could not be shown.'">Message</p>
  <a th:href="@{/dashboard}" class="btn btn-primary">Back to dashboard</a>
</div></div></div>
</body></html>
