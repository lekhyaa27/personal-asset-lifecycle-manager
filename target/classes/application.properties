# ---- DATABASE (EDIT THESE TWO LINES) ----
spring.datasource.url=jdbc:mysql://localhost:3306/personal_asset_lifecycle_manager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Hibernate creates/updates the tables automatically from the model classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
server.port=8080

# File uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=uploads

server.forward-headers-strategy=framework