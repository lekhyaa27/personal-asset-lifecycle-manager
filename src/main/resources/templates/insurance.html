<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Insurance')}"></head>
<body>
<nav th:replace="~{fragments :: sidebar('insurance')}"></nav>
<main class="content">
  <div th:replace="~{fragments :: flash}"></div>
  <h3 class="mb-3">Insurance Management</h3>
  <div class="alert alert-warning" th:unless="${#lists.isEmpty(soon)}"><strong><i class="bi bi-bell"></i> Expiring within 30 days:</strong>
    <ul class="mb-0"><li th:each="s : ${soon}"><span th:text="${s.assetName()}"></span> - ends <span th:text="${s.end()}"></span> (<span th:text="${s.days()}"></span> days)</li></ul></div>
  <div class="card mb-4"><div class="card-body"><h6>Add / update Insurance details</h6>
    <form id="expiryForm" th:action="@{/insurance}" method="post" class="row g-3">
      <div class="col-md-3"><label class="form-label">Asset *</label><select name="assetId" class="form-select" required><option value="">Select...</option><option th:each="a : ${assets}" th:value="${a.id}" th:text="${a.name}"></option></select></div>
      <div class="col-md-3"><label class="form-label">Provider *</label><input name="provider" class="form-control" required></div>
      <div class="col-md-2"><label class="form-label">Policy number</label><input name="policyNumber" class="form-control"></div>
      <div class="col-md-2"><label class="form-label">Start date *</label><input type="date" name="startDate" class="form-control" required></div>
      <div class="col-md-2"><label class="form-label">End date *</label><input type="date" name="endDate" class="form-control" required></div>
      <div class="col-12"><button class="btn btn-primary">Save</button></div>
    </form></div></div>
  <form method="get" th:action="@{/insurance}" class="row g-2 mb-3">
    <div class="col-md-4"><input name="q" th:value="${q}" class="form-control" placeholder="Search asset or provider"></div>
    <div class="col-md-3"><select name="filter" class="form-select"><option value="">All</option>
      <option value="ACTIVE" th:selected="${filter=='ACTIVE'}">Active</option><option value="EXPIRING_SOON" th:selected="${filter=='EXPIRING_SOON'}">Expiring soon</option>
      <option value="EXPIRED" th:selected="${filter=='EXPIRED'}">Expired</option><option value="NOT_AVAILABLE" th:selected="${filter=='NOT_AVAILABLE'}">Not available</option></select></div>
    <div class="col-md-2"><button class="btn btn-outline-primary w-100">Filter</button></div></form>
  <div class="card"><div class="table-responsive"><table class="table align-middle mb-0">
    <thead><tr><th>Asset</th><th>Provider</th><th>Policy</th><th>Start</th><th>End</th><th>Status</th><th>Days left</th><th></th></tr></thead>
    <tbody><tr th:if="${#lists.isEmpty(rows)}"><td colspan="8" class="text-center text-muted">Nothing found.</td></tr>
    <tr th:each="r : ${rows}"><td><a th:href="@{/assets/{id}(id=${r.assetId()})}" th:text="${r.assetName()}"></a></td><td th:text="${r.provider()}"></td><td th:text="${r.policy()}"></td>
      <td th:text="${r.start()}"></td><td th:text="${r.end()}"></td><td><span th:replace="~{fragments :: badge(${r.status()})}"></span></td>
      <td th:text="${r.days() != null and r.days() >= 0} ? ${r.days()} : '-'"></td>
      <td><button type="button" class="btn btn-sm btn-outline-primary edit-expiry" th:data-asset-id="${r.assetId()}" th:data-provider="${r.provider() ?: ''}" th:data-start-date="${r.start()}" th:data-end-date="${r.end()}" th:data-policy-number="${r.policy() ?: ''}">Edit</button></td></tr></tbody>
  </table></div></div>
</main>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body></html>
