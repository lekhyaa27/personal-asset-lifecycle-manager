<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | Asset Manager'">Asset Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav th:fragment="sidebar(active)" class="sidebar">
  <div class="brand"><i class="bi bi-box-seam"></i> Asset Lifecycle Manager</div>
  <ul class="nav flex-column gap-1">
    <li><a class="nav-link" th:classappend="${active=='dashboard'} ? 'active'" th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
    <li><a class="nav-link" th:classappend="${active=='assets'} ? 'active'" th:href="@{/assets}"><i class="bi bi-laptop"></i> My Assets</a></li>
    <li><a class="nav-link" th:classappend="${active=='new'} ? 'active'" th:href="@{/assets/new}"><i class="bi bi-plus-circle"></i> Add Asset</a></li>
    <li><a class="nav-link" th:classappend="${active=='maintenance'} ? 'active'" th:href="@{/maintenance}"><i class="bi bi-tools"></i> Maintenance</a></li>
    <li><a class="nav-link" th:classappend="${active=='repairs'} ? 'active'" th:href="@{/repairs}"><i class="bi bi-wrench-adjustable"></i> Repairs</a></li>
    <li><a class="nav-link" th:classappend="${active=='upgrades'} ? 'active'" th:href="@{/upgrades}"><i class="bi bi-arrow-up-circle"></i> Upgrades</a></li>
    <li><a class="nav-link" th:classappend="${active=='warranty'} ? 'active'" th:href="@{/warranty}"><i class="bi bi-shield-check"></i> Warranty</a></li>
    <li><a class="nav-link" th:classappend="${active=='insurance'} ? 'active'" th:href="@{/insurance}"><i class="bi bi-umbrella"></i> Insurance</a></li>
    <li><a class="nav-link" th:classappend="${active=='reports'} ? 'active'" th:href="@{/reports}"><i class="bi bi-bar-chart"></i> Reports</a></li>
    <li><a class="nav-link" th:classappend="${active=='notifications'} ? 'active'" th:href="@{/notifications}"><i class="bi bi-bell"></i> Notifications
      <span class="badge bg-danger ms-auto" th:if="${notifCount != null and notifCount > 0}" th:text="${notifCount}">0</span></a></li>
  </ul>
  <hr>
  <div class="px-2 small text-muted mb-2"><i class="bi bi-person-circle"></i> <span th:text="${userName}">User</span></div>
  <form th:action="@{/logout}" method="post"><button class="btn btn-outline-secondary btn-sm w-100"><i class="bi bi-box-arrow-right"></i> Logout</button></form>
</nav>
<div th:fragment="flash">
  <div class="alert alert-success alert-dismissible fade show" th:if="${msg}"><span th:text="${msg}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
  <div class="alert alert-danger alert-dismissible fade show" th:if="${error}"><span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
</div>
<span th:fragment="badge(s)" class="badge"
  th:classappend="${s == 'ACTIVE' or s == 'GOOD' or s == 'COMPLETED' or s == 'EXCELLENT'} ? 'bg-success' : (${s == 'EXPIRING_SOON' or s == 'FAIR' or s == 'UNDER_MAINTENANCE' or s == 'IN_PROGRESS'} ? 'bg-warning text-dark' : (${s == 'EXPIRED' or s == 'NEEDS_ATTENTION' or s == 'UNDER_REPAIR' or s == 'PENDING' or s == 'POOR'} ? 'bg-danger' : 'bg-secondary'))"
  th:text="${s}">STATUS</span>
<span th:fragment="money(v)" th:text="'₹ ' + ${#numbers.formatDecimal(v != null ? v : 0, 1, 'COMMA', 2, 'POINT')}">₹ 0.00</span>
<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</th:block>
</body>
</html>
