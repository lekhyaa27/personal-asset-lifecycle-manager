<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Maintenance')}"></head>
<body>
<nav th:replace="~{fragments :: sidebar('maintenance')}"></nav>
<main class="content">
  <div th:replace="~{fragments :: flash}"></div>
  <h3 class="mb-3">Maintenance Management</h3>
  <div class="card mb-4"><div class="card-body">
    <div class="mb-3" data-toggle-form="#recordForm" data-no="#noMsg">
      <label class="form-label fw-semibold d-block">Is maintenance required for an asset?</label>
      <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="needed" id="yes" value="yes" th:checked="${selectedAssetId != null}"><label class="form-check-label" for="yes">Yes</label></div>
      <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="needed" id="no" value="no"><label class="form-check-label" for="no">No</label></div>
    </div>
    <div id="noMsg" class="alert alert-secondary d-none">No maintenance record needed. You can continue to <a th:href="@{/assets}">your assets</a>.</div>
    <form id="recordForm" th:action="@{/maintenance}" method="post" class="row g-3" th:classappend="${selectedAssetId == null} ? 'd-none'">
      <div class="col-md-4"><label class="form-label">Asset *</label><select name="assetId" class="form-select" required><option value="">Select...</option>
        <option th:each="a : ${assets}" th:value="${a.id}" th:text="${a.name}" th:selected="${a.id == selectedAssetId}"></option></select></div>
      <div class="col-md-4"><label class="form-label">Maintenance date *</label><input type="date" name="maintenanceDate" class="form-control" th:value="${today}" required></div>
      <div class="col-md-4"><label class="form-label">Type *</label><select name="maintenanceType" class="form-select"><option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option></select></div>
      <div class="col-md-4"><label class="form-label">Provider</label><input name="provider" class="form-control"></div>
      <div class="col-md-4"><label class="form-label">Cost (₹) *</label><input type="number" step="0.01" min="0" name="cost" class="form-control" required></div>
      <div class="col-md-4"><label class="form-label">Next maintenance date</label><input type="date" name="nextMaintenanceDate" class="form-control"></div>
      <div class="col-md-6"><label class="form-label">Description</label><textarea name="description" rows="2" class="form-control"></textarea></div>
      <div class="col-md-6"><label class="form-label">Notes</label><textarea name="notes" rows="2" class="form-control"></textarea></div>
      <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" name="markUnder" value="true" id="mu"><label class="form-check-label" for="mu">Mark asset as UNDER_MAINTENANCE now</label></div></div>
      <div class="col-12"><button class="btn btn-primary">Save maintenance</button></div>
    </form>
  </div></div>
  <div class="card"><div class="card-body"><div class="d-flex justify-content-between"><h6>Maintenance history</h6><strong>Total: <span th:replace="~{fragments :: money(${total})}"></span></strong></div>
    <div class="table-responsive"><table class="table table-sm align-middle">
      <thead><tr><th>Date</th><th>Asset</th><th>Type</th><th>Provider</th><th>Cost</th><th>Next due</th></tr></thead>
      <tbody><tr th:if="${#lists.isEmpty(records)}"><td colspan="6" class="text-muted text-center">No records yet.</td></tr>
      <tr th:each="r : ${records}"><td th:text="${r.maintenanceDate}"></td><td><a th:href="@{/assets/{id}(id=${r.asset.id})}" th:text="${r.asset.name}"></a></td>
        <td th:text="${r.maintenanceType}"></td><td th:text="${r.provider}"></td><td><span th:replace="~{fragments :: money(${r.cost})}"></span></td><td th:text="${r.nextMaintenanceDate}"></td></tr></tbody>
    </table></div></div></div>
</main>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body></html>
