<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Login')}"></head>
<body>
<div class="auth-wrap"><div class="card auth-card"><div class="card-body p-4">
  <h4 class="text-center mb-1"><i class="bi bi-box-seam text-primary"></i> Asset Lifecycle Manager</h4>
  <p class="text-center text-muted mb-4">Sign in to your account</p>
  <div th:replace="~{fragments :: flash}"></div>
  <form th:action="@{/login}" method="post">
    <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
    <button class="btn btn-primary w-100">Login</button>
  </form>
  <p class="text-center mt-3 mb-0">New here? <a th:href="@{/register}">Create an account</a></p>
</div></div></div>
</body></html>
