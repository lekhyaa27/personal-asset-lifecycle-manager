<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Repairs')}"></head>
<body>
<nav th:replace="~{fragments :: sidebar('repairs')}"></nav>
<main class="content">
  <div th:replace="~{fragments :: flash}"></div>
  <h3 class="mb-3">Repair Management</h3>
  <div class="card mb-4"><div class="card-body">
    <div class="mb-3" data-toggle-form="#recordForm" data-no="#noMsg">
      <label class="form-label fw-semibold d-block">Is repair required for an asset?</label>
      <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="needed" id="yes" value="yes" th:checked="${selectedAssetId != null}"><label class="form-check-label" for="yes">Yes</label></div>
      <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="needed" id="no" value="no"><label class="form-check-label" for="no">No</label></div>
    </div>
    <div id="noMsg" class="alert alert-secondary d-none">No repair record needed. You can continue to <a th:href="@{/assets}">your assets</a>.</div>
    <form id="recordForm" th:action="@{/repairs}" method="post" class="row g-3" th:classappend="${selectedAssetId == null} ? 'd-none'">
      <div class="col-md-4"><label class="form-label">Asset *</label><select name="assetId" class="form-select" required><option value="">Select...</option>
        <option th:each="a : ${assets}" th:value="${a.id}" th:text="${a.name}" th:selected="${a.id == selectedAssetId}"></option></select></div>
      <div class="col-md-4"><label class="form-label">Repair date *</label><input type="date" name="repairDate" class="form-control" th:value="${today}" required></div>
      <div class="col-md-4"><label class="form-label">Repair type</label><select name="repairType" class="form-select"><option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option></select></div>
      <div class="col-12"><label class="form-label">Problem description *</label><textarea name="problemDescription" rows="2" class="form-control" required></textarea></div>
      <div class="col-md-4"><label class="form-label">Provider</label><input name="provider" class="form-control"></div>
      <div class="col-md-4"><label class="form-label">Cost (₹) *</label><input type="number" step="0.01" min="0" name="cost" class="form-control" required></div>
      <div class="col-md-4"><label class="form-label">Parts replaced</label><input name="partsReplaced" class="form-control"></div>
      <div class="col-md-4"><label class="form-label">Repair status</label><select name="status" class="form-select"><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option></select></div>
      <div class="col-md-4"><label class="form-label">Completion date</label><input type="date" name="completionDate" class="form-control"></div>
      <div class="col-md-4"><label class="form-label">Update asset condition to</label><select name="newCondition" class="form-select"><option value="">(no change)</option><option th:each="c : ${conditions}" th:value="${c}" th:text="${c}"></option></select></div>
      <div class="col-12"><label class="form-label">Notes</label><textarea name="notes" rows="2" class="form-control"></textarea></div>
      <div class="col-12"><button class="btn btn-primary">Save repair</button></div>
    </form>
  </div></div>
  <div class="card"><div class="card-body"><div class="d-flex justify-content-between"><h6>Repair history</h6><strong>Total: <span th:replace="~{fragments :: money(${total})}"></span></strong></div>
    <div class="table-responsive"><table class="table table-sm align-middle">
      <thead><tr><th>Date</th><th>Asset</th><th>Problem</th><th>Status</th><th>Cost</th><th></th></tr></thead>
      <tbody><tr th:if="${#lists.isEmpty(records)}"><td colspan="6" class="text-muted text-center">No repairs yet.</td></tr>
      <tr th:each="r : ${records}"><td th:text="${r.repairDate}"></td><td><a th:href="@{/assets/{id}(id=${r.asset.id})}" th:text="${r.asset.name}"></a></td>
        <td th:text="${r.problemDescription}"></td><td><span th:replace="~{fragments :: badge(${r.status})}"></span></td>
        <td><span th:replace="~{fragments :: money(${r.cost})}"></span></td>
        <td><form th:if="${r.status != 'COMPLETED'}" method="post" th:action="@{/repairs/{id}/complete(id=${r.id})}"><button class="btn btn-sm btn-success">Mark completed</button></form></td></tr></tbody>
    </table></div></div></div>
</main>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body></html>
