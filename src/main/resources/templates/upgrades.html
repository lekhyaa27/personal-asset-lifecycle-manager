<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Upgrades')}"></head>
<body>
<nav th:replace="~{fragments :: sidebar('upgrades')}"></nav>
<main class="content">
  <div th:replace="~{fragments :: flash}"></div>
  <h3 class="mb-3">Upgrade Management</h3>
  <div class="card mb-4"><div class="card-body">
    <h6 th:text="${form.id != null} ? 'Edit upgrade' : 'Add upgrade'"></h6>
    <form th:action="@{/upgrades}" method="post" class="row g-3">
      <input type="hidden" name="id" th:value="${form.id}">
      <div class="col-md-4"><label class="form-label">Asset *</label><select name="assetId" class="form-select" required><option value="">Select...</option>
        <option th:each="a : ${assets}" th:value="${a.id}" th:text="${a.name}" th:selected="${a.id == selectedAssetId}"></option></select></div>
      <div class="col-md-4"><label class="form-label">Upgrade date *</label><input type="date" name="upgradeDate" class="form-control" th:value="${form.upgradeDate}" required></div>
      <div class="col-md-4"><label class="form-label">Cost (₹) *</label><input type="number" step="0.01" min="0" name="cost" class="form-control" th:value="${form.cost}" required></div>
      <div class="col-md-8"><label class="form-label">Description *</label><input name="description" class="form-control" th:value="${form.description}" required></div>
      <div class="col-md-4"><label class="form-label">Provider</label><input name="provider" class="form-control" th:value="${form.provider}"></div>
      <div class="col-12"><label class="form-label">Notes</label><textarea name="notes" rows="2" class="form-control" th:text="${form.notes}"></textarea></div>
      <div class="col-12"><button class="btn btn-primary">Save upgrade</button> <a th:href="@{/upgrades}" class="btn btn-outline-secondary" th:if="${form.id != null}">Cancel</a></div>
    </form>
  </div></div>
  <div class="card"><div class="card-body"><div class="d-flex justify-content-between"><h6>Upgrade history</h6><strong>Total: <span th:replace="~{fragments :: money(${total})}"></span></strong></div>
    <div class="table-responsive"><table class="table table-sm align-middle">
      <thead><tr><th>Date</th><th>Asset</th><th>Description</th><th>Provider</th><th>Cost</th><th></th></tr></thead>
      <tbody><tr th:if="${#lists.isEmpty(records)}"><td colspan="6" class="text-muted text-center">No upgrades yet.</td></tr>
      <tr th:each="r : ${records}"><td th:text="${r.upgradeDate}"></td><td><a th:href="@{/assets/{id}(id=${r.asset.id})}" th:text="${r.asset.name}"></a></td>
        <td th:text="${r.description}"></td><td th:text="${r.provider}"></td><td><span th:replace="~{fragments :: money(${r.cost})}"></span></td>
        <td><a class="btn btn-sm btn-outline-secondary" th:href="@{/upgrades(editId=${r.id})}"><i class="bi bi-pencil"></i></a></td></tr></tbody>
    </table></div></div></div>
</main>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body></html>
