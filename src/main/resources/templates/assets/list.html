<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My Assets')}"></head>
<body>
<nav th:replace="~{fragments :: sidebar('assets')}"></nav>
<main class="content">
  <div th:replace="~{fragments :: flash}"></div>
  <div class="d-flex justify-content-between mb-3"><h3>My Assets</h3><a th:href="@{/assets/new}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add Asset</a></div>
  <form method="get" th:action="@{/assets}" class="card card-body mb-3"><div class="row g-2">
    <div class="col-md-3"><input name="q" th:value="${q}" class="form-control" placeholder="Search name or brand"></div>
    <div class="col-md-2"><select name="category" class="form-select"><option value="">All categories</option>
      <option th:each="c : ${categories}" th:value="${c}" th:text="${c}" th:selected="${c == category}"></option></select></div>
    <div class="col-md-2"><select name="status" class="form-select"><option value="">All statuses</option>
      <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == status}"></option></select></div>
    <div class="col-md-2"><select name="sort" class="form-select">
      <option value="purchaseDate" th:selected="${sort=='purchaseDate'}">Sort: Purchase date</option>
      <option value="purchasePrice" th:selected="${sort=='purchasePrice'}">Sort: Purchase price</option></select></div>
    <div class="col-md-1"><select name="dir" class="form-select"><option value="desc" th:selected="${dir=='desc'}">Desc</option><option value="asc" th:selected="${dir=='asc'}">Asc</option></select></div>
    <div class="col-md-2"><button class="btn btn-outline-primary w-100"><i class="bi bi-search"></i> Apply</button></div>
  </div></form>
  <div class="card"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
    <thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Brand</th><th>Purchased</th><th>Price</th><th>Current Value</th><th>Status</th><th>Warranty</th><th>Actions</th></tr></thead>
    <tbody>
      <tr th:if="${#lists.isEmpty(rows)}"><td colspan="10" class="text-center text-muted py-4">No assets found.</td></tr>
      <tr th:each="r : ${rows}">
        <td th:text="${r.asset().id}"></td>
        <td><a th:href="@{/assets/{id}(id=${r.asset().id})}" th:text="${r.asset().name}" class="fw-semibold text-decoration-none"></a></td>
        <td th:text="${r.asset().category}"></td><td th:text="${r.asset().brand}"></td>
        <td th:text="${r.asset().purchaseDate}"></td>
        <td><span th:replace="~{fragments :: money(${r.asset().purchasePrice})}"></span></td>
        <td><span th:replace="~{fragments :: money(${r.current()})}"></span></td>
        <td><span th:replace="~{fragments :: badge(${r.asset().status})}"></span></td>
        <td><span th:replace="~{fragments :: badge(${r.warrantyStatus()})}"></span></td>
        <td class="text-nowrap">
          <a class="btn btn-sm btn-outline-primary" th:href="@{/assets/{id}(id=${r.asset().id})}" title="View"><i class="bi bi-eye"></i></a>
          <a class="btn btn-sm btn-outline-secondary" th:href="@{/assets/{id}/edit(id=${r.asset().id})}" title="Edit"><i class="bi bi-pencil"></i></a>
          <a class="btn btn-sm btn-outline-warning" th:href="@{/maintenance(assetId=${r.asset().id})}" title="Add maintenance"><i class="bi bi-tools"></i></a>
          <a class="btn btn-sm btn-outline-info" th:href="@{/repairs(assetId=${r.asset().id})}" title="Add repair"><i class="bi bi-wrench-adjustable"></i></a>
          <a class="btn btn-sm btn-outline-dark" th:href="@{/assets/{id}(id=${r.asset().id})} + '#timeline'" title="History"><i class="bi bi-clock-history"></i></a>
          <form class="d-inline" method="post" th:action="@{/assets/{id}/delete(id=${r.asset().id})}" data-confirm="Mark this asset as DISPOSED? Its history will be kept.">
            <button class="btn btn-sm btn-outline-danger" title="Delete (dispose)" th:disabled="${r.asset().status == 'DISPOSED'}"><i class="bi bi-trash"></i></button></form>
        </td>
      </tr>
    </tbody></table></div></div>
  <nav class="mt-3" th:if="${pageData.totalPages > 1}"><ul class="pagination">
    <li class="page-item" th:each="p : ${#numbers.sequence(0, pageData.totalPages - 1)}" th:classappend="${p == pageData.number} ? 'active'">
      <a class="page-link" th:href="@{/assets(q=${q},category=${category},status=${status},sort=${sort},dir=${dir},page=${p})}" th:text="${p + 1}"></a></li>
  </ul></nav>
</main>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body></html>
