<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Asset Form')}"></head>
<body>
<nav th:replace="~{fragments :: sidebar('new')}"></nav>
<main class="content">
  <h3 class="mb-3" th:text="${edit} ? 'Edit Asset' : 'Add New Asset'">Add Asset</h3>
  <form th:action="${edit} ? @{/assets/{id}/edit(id=${assetId})} : @{/assets}" th:object="${form}" method="post">
    <div class="card mb-3"><div class="card-body"><h6 class="mb-3">Basic details</h6><div class="row g-3">
      <div class="col-md-6"><label class="form-label">Asset name *</label><input th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{name}"></div></div>
      <div class="col-md-3"><label class="form-label">Category *</label><select th:field="*{category}" class="form-select" th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'"><option value="">Select...</option><option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option></select><div class="invalid-feedback" th:errors="*{category}"></div></div>
      <div class="col-md-3"><label class="form-label">Condition</label><select th:field="*{assetCondition}" class="form-select"><option th:each="c : ${conditions}" th:value="${c}" th:text="${c}"></option></select></div>
      <div class="col-md-4"><label class="form-label">Brand</label><input th:field="*{brand}" class="form-control"></div>
      <div class="col-md-4"><label class="form-label">Model</label><input th:field="*{model}" class="form-control"></div>
      <div class="col-md-4"><label class="form-label">Serial number</label><input th:field="*{serialNumber}" class="form-control"></div>
      <div class="col-md-4"><label class="form-label">Purchase price (₹) *</label><input type="number" step="0.01" min="0.01" th:field="*{purchasePrice}" class="form-control" th:classappend="${#fields.hasErrors('purchasePrice')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{purchasePrice}"></div></div>
      <div class="col-md-4"><label class="form-label">Purchase date *</label><input type="date" th:field="*{purchaseDate}" class="form-control" th:classappend="${#fields.hasErrors('purchaseDate')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{purchaseDate}"></div></div>
      <div class="col-md-4"><label class="form-label">Purchase location</label><input th:field="*{purchaseLocation}" class="form-control"></div>
      <div class="col-md-4"><label class="form-label">Expected useful life (years)</label><input type="number" min="1" th:field="*{usefulLifeYears}" class="form-control" th:classappend="${#fields.hasErrors('usefulLifeYears')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{usefulLifeYears}"></div></div>
      <div class="col-md-4"><label class="form-label">Estimated salvage value (₹)</label><input type="number" step="0.01" min="0" th:field="*{salvageValue}" class="form-control" th:classappend="${#fields.hasErrors('salvageValue')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{salvageValue}"></div></div>
      <div class="col-12"><label class="form-label">Description</label><textarea th:field="*{description}" rows="2" class="form-control"></textarea></div>
      <div class="col-12"><label class="form-label">Notes</label><textarea th:field="*{notes}" rows="2" class="form-control"></textarea></div>
    </div></div></div>

    <div class="card mb-3" th:unless="${edit}"><div class="card-body"><h6 class="mb-3">Warranty (optional)</h6><div class="row g-3">
      <div class="col-md-4"><label class="form-label">Provider</label><input th:field="*{warrantyProvider}" class="form-control"></div>
      <div class="col-md-4"><label class="form-label">Start date</label><input type="date" th:field="*{warrantyStartDate}" class="form-control"></div>
      <div class="col-md-4"><label class="form-label">End date</label><input type="date" th:field="*{warrantyEndDate}" class="form-control" th:classappend="${#fields.hasErrors('warrantyEndDate')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{warrantyEndDate}"></div></div>
    </div></div></div>
    <div class="card mb-3" th:unless="${edit}"><div class="card-body"><h6 class="mb-3">Insurance (optional)</h6><div class="row g-3">
      <div class="col-md-3"><label class="form-label">Provider</label><input th:field="*{insuranceProvider}" class="form-control"></div>
      <div class="col-md-3"><label class="form-label">Policy number</label><input th:field="*{insurancePolicyNumber}" class="form-control"></div>
      <div class="col-md-3"><label class="form-label">Start date</label><input type="date" th:field="*{insuranceStartDate}" class="form-control"></div>
      <div class="col-md-3"><label class="form-label">End date</label><input type="date" th:field="*{insuranceEndDate}" class="form-control" th:classappend="${#fields.hasErrors('insuranceEndDate')} ? 'is-invalid'"><div class="invalid-feedback" th:errors="*{insuranceEndDate}"></div></div>
    </div></div></div>
    <p class="text-muted small" th:if="${edit}">Warranty and insurance are edited on their own pages.</p>
    <button class="btn btn-primary"><i class="bi bi-save"></i> Save asset</button>
    <a th:href="@{/assets}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</main>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body></html>
